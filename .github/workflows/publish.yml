name: Publicar en GitHub Packages

# Se dispara al crear un tag con formato v<mayor>.<menor>.<parche>, por ejemplo:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # crear el Release
  packages: write   # publicar en GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github                  # coincide con <distributionManagement> del pom
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Fijar la versión desde el tag (v0.1.0 -> 0.1.0)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publicando versión $VERSION"
          ./mvnw -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          # El BOM es independiente del padre, así que hay que fijarle la versión aparte
          ./mvnw -B versions:set -f bom/pom.xml -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Compilar, testear y publicar
        run: ./mvnw -B clean deploy
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Crear el Release con notas automáticas
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
